services:
  - type: web
    name: laundryflow-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: laundryflow-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: ENVIRONMENT
        value: production

databases:
  - name: laundryflow-db
    databaseName: laundryflow
    user: laundryflow_user
    plan: free
